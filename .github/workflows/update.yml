name: Update WMSC Dock water quality

# Runs silently, every hour, with no chat messages. It re-reads the public
# Xylem dashboard in a headless browser, regenerates index.html, and pushes
# it only if the values actually changed. GitHub Pages then redeploys the
# same URL automatically. If the scrape fails, nothing is overwritten and
# the previous page stays up.
on:
  schedule:
    # Top of every hour, UTC. GitHub Actions schedules are in UTC.
    - cron: '0 * * * *'
  workflow_dispatch: # lets you test it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Scrape dashboard and regenerate index.html
        run: node update.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "wmsc-dock-updater"
          git config user.email "wmsc-dock-updater@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "Update WMSC Dock water quality"
            git push
          fi
